<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#070c1d"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Cyber Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Radar Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2"/>
  
  <!-- Central Glowing Reactor Hexagon Core -->
  <polygon points="256,196 308,226 308,286 256,316 204,286 204,226" fill="#06122a" stroke="url(#cyanGlow)" stroke-width="5" filter="url(#glow)"/>
  
  <!-- J.A.R.V.I.S. Core Emblem & Candlestick Alpha Vector -->
  <path d="M256 160 L256 352" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <rect x="246" y="210" width="20" height="70" rx="4" fill="url(#emeraldGlow)" stroke="#34d399" stroke-width="2"/>
  
  <!-- Institutional Quant Orbit Satellites -->
  <circle cx="160" cy="180" r="7" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="352" cy="180" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="340" cy="340" r="7" fill="#10b981" filter="url(#glow)"/>
  <circle cx="172" cy="340" r="7" fill="#fbbf24" filter="url(#glow)"/>
  
  <!-- Typography / Brandmark -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#e0f2fe" text-anchor="middle" letter-spacing="8">JARVIS</text>
  <text x="256" y="445" font-family="monospace" font-weight="700" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="4">QUANT • NSE</text>
</svg>
