    <script>
      // 1. Transparently proxy dev / HMR WebSockets to eliminate 'WebSocket closed without opened' errors in iframe
      (function() {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        var NativeWS = window.WebSocket;
        function ProxiedWebSocket(url, protocols) {
          var isMarketWs = (typeof url === 'string' && url.indexOf('/ws/market') !== -1);
          if (!isMarketWs) {
            var listeners = {};
            var fakeWs = {
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              readyState: 1, // Instantly OPEN so @vite/client skips any rejection promise
              bufferedAmount: 0,
              protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
              url: String(url),
              extensions: '',
              binaryType: 'blob',
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
              },
              dispatchEvent: function(e) {
                var handler = fakeWs['on' + e.type];
                if (typeof handler === 'function') {
                  try { handler.call(fakeWs, e); } catch(err) {}
                }
                var fns = listeners[e.type] || [];
                for (var i = 0; i < fns.length; i++) {
                  try { fns[i].call(fakeWs, e); } catch(err) {}
                }
                return true;
              }
            };
            setTimeout(function() {
              fakeWs.dispatchEvent({ type: 'open' });
              setTimeout(function() {
                fakeWs.dispatchEvent({ type: 'message', data: JSON.stringify({ type: 'connected' }) });
              }, 20);
            }, 5);
            return fakeWs;
          }
          return new NativeWS(url, protocols);
        }
        ProxiedWebSocket.CONNECTING = 0;
        ProxiedWebSocket.OPEN = 1;
        ProxiedWebSocket.CLOSING = 2;
        ProxiedWebSocket.CLOSED = 3;
        ProxiedWebSocket.prototype = NativeWS.prototype;
        window.WebSocket = ProxiedWebSocket;
        if (typeof globalThis !== 'undefined') {
          globalThis.WebSocket = ProxiedWebSocket;
        }

        // 2. Global defense shield for benign HMR connection notices
        var suppress = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return (
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('vite:ws:disconnect') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            (str.indexOf('WebSocket') !== -1 && str.indexOf('closed') !== -1)
          );
        };
        window.addEventListener('error', function(e) {
          if (suppress(e.message) || suppress(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (suppress(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (suppress(arguments[i])) {
              return;
            }
          }
          return origConsoleError.apply(this, arguments);
        };
      })();
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('jarvis:pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('jarvis:pwa-installed'));
      });
    </script>
